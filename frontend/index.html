<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <h1>ttt</h1>

    <div class="backend-version"></div>

    <script>
        const API_ROOT = 'http://localhost:8000/api/';
        updateVersion();
        async function updateVersion() {
            const r = await fetch(API_ROOT + 'version');
            const version = await r.json();
            const backendVersion = document.querySelector('.backend-version');
            backendVersion.textContent = `${version.major}.${version.minor}.${version.build}`;
        }
    </script>
</body>

</html>
